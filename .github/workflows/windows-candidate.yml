name: Windows POS candidate
on:
  workflow_dispatch:
  push:
    branches: [main, feat/f6-backup-import-distribution, feat/arca-integration]
    paths: ['backend/**', 'frontend/**', 'packaging/**', '.github/workflows/windows-candidate.yml']
  pull_request:
    branches: [main, feat/f6-backup-import-distribution]
    paths: ['backend/**', 'frontend/**', 'packaging/**', '.github/workflows/windows-candidate.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native bundle and installer
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Test installed executable without runtime tools on PATH
        shell: pwsh
        run: python packaging/smoke_installer.py
      - name: Prepare verified Windows download
        shell: pwsh
        run: python packaging/prepare_download.py
      - uses: actions/upload-artifact@v4
        with:
          name: POS-Windows-${{ github.ref_name == 'main' && 'main' || 'candidate' }}
          path: dist/download/*
          if-no-files-found: error
          retention-days: 30
