[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"
[project]
name = "gestion-inteligente-pos-backend"
version = "0.5.1"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "argon2-cffi>=23.1,<26", "tzdata>=2025.2,<2027", "cryptography==50.0.2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
